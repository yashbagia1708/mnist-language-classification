name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  run-analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Run the analysis and check results
        run: python tests/check_results.py
